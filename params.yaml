# Hyperparameters for the kidney disease classification pipeline.
# Populated progressively as each stage is implemented.

# --- Prepare Base Model ---
AUGMENTATION: true
IMAGE_SIZE: [224, 224]
INCLUDE_TOP: false
WEIGHTS: imagenet
CLASSES: 2
POOLING: avg
LEARNING_RATE: 0.0001

# --- Training ---
BATCH_SIZE: 16
EPOCHS: 25
