# Hyperparameters for the kidney disease classification pipeline.
# Populated progressively as each stage is implemented.

# --- Prepare Base Model ---
AUGMENTATION: false
IMAGE_SIZE: [224, 224,3]
INCLUDE_TOP: false
WEIGHTS: imagenet
CLASSES: 2
POOLING: avg
LEARNING_RATE: 0.01

# --- Training ---
BATCH_SIZE: 16
EPOCHS: 2
